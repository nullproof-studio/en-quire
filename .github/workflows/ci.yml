name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # lint depends on en-core's dist (cross-package type resolution)
      - run: npm run build -w @nullproof-studio/en-core
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  test-integration:
    name: Test (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # en-core dist is required — integration tests import from
      # packages/en-quire/src, which uses @nullproof-studio/en-core at runtime.
      - run: npm run build -w @nullproof-studio/en-core
      - run: npm run test:integration

  publish-dryrun:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Validate packaging (contents, files, prepack) without the registry
      # "cannot publish over previously published versions" check that
      # `npm publish --dry-run` performs on npm 11+ (which fails every PR that
      # doesn't bump the version). `npm pack --dry-run` is the per-PR gate.
      - run: npm pack -w @nullproof-studio/en-core --dry-run
      - run: npm pack -w @nullproof-studio/en-quire --dry-run
      - run: npm pack -w @nullproof-studio/en-scribe --dry-run
